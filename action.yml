name: "Yaffle Outputs"
description: "Fetch Terraform outputs from a Yaffle preview for use in CI/CD pipelines"
author: "Yaffle"

branding:
  icon: "download-cloud"
  color: "green"

inputs:
  api-url:
    description: "Yaffle API base URL"
    required: false
    default: "https://api.yaffle.dev"
  org:
    description: "Organization/owner name (defaults to repository owner)"
    required: false
  repo:
    description: "Repository name (defaults to current repository name)"
    required: false
  pr-number:
    description: "Positive PR number to get outputs for as pr-{number} (defaults to current PR)"
    required: false
  environment:
    description: "Environment name (e.g., 'main', 'pr-42'). Defaults to current PR or branch."
    required: false
  workspace:
    description: "Workspace path (defaults to root '.')"
    required: false
    default: "."
  head-sha:
    description: "Commit SHA to scope environment lookup/stream (defaults to workflow SHA)"
    required: false
    default: ""
  token:
    description: "Yaffle API token for authentication"
    required: false
    default: ""
  wait:
    description: "Wait for preview to be ready (true/false)"
    required: false
    default: "false"
  wait-timeout:
    description: "Timeout in seconds when waiting for preview (default: 300)"
    required: false
    default: "300"

outputs:
  preview-id:
    value: ${{ steps.fetch-outputs.outputs.preview-id }}
    description: "The Yaffle preview ID"
  preview-status:
    value: ${{ steps.fetch-outputs.outputs.preview-status }}
    description: "The preview status (ready, planning, applying, failed, etc.)"
  outputs-json:
    value: ${{ steps.fetch-outputs.outputs.outputs-json }}
    description: "All outputs as a JSON string"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "26.12.1"
    - id: fetch-outputs
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
      env:
        INPUT_API-URL: ${{ inputs.api-url }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_HEAD-SHA: ${{ inputs.head-sha }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAIT-TIMEOUT: ${{ inputs.wait-timeout }}
